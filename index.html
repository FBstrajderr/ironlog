<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>IronLog</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#14161a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="IronLog" />
<meta name="format-detection" content="telephone=no" />
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />

<style>
:root {
  --bg: #14161a;
  --panel: #1c1f24;
  --panel-2: #22262b;
  --border: #2b2f35;
  --text: #f0f0ec;
  --text-muted: #8a9099;
  --accent: #e8432b;
  --gold: #c9a227;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  min-height: 100%;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: contain;
}
button, .checkbox, .day-pill, .tab-btn, .week-cell {
  -webkit-user-select: none; user-select: none;
}
/* 16px minimum stops iOS Safari zooming in when a field is focused */
input, select, textarea { font-size: 16px; }
#app {
  min-height: 100vh;
  max-width: 620px;
  margin: 0 auto;
  padding: max(20px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
}
h1 {
  font-family: "Arial Narrow", "Helvetica Neue Condensed", sans-serif;
  font-weight: 900; font-size: 30px; letter-spacing: 1px;
  margin: 0; text-transform: uppercase;
}
h1 .accent { color: var(--accent); }
.head { margin-bottom: 18px; }
.sub {
  color: var(--text-muted); font-size: 12px;
  letter-spacing: 0.5px; text-transform: uppercase; margin-top: 2px;
}
.tabs {
  display: flex; gap: 4px; margin-bottom: 18px;
  border-bottom: 1px solid var(--border); overflow-x: auto;
}
.tab-btn {
  background: none; border: none; color: var(--text-muted);
  font-family: "Arial Narrow", sans-serif; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.8px; font-size: 14px;
  padding: 13px 13px; cursor: pointer; border-bottom: 3px solid transparent;
  display: flex; align-items: center; gap: 6px; white-space: nowrap; min-height: 46px;
}
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px; margin-bottom: 10px;
}
.section-label {
  font-family: "Arial Narrow", sans-serif; font-weight: 800;
  text-transform: uppercase; letter-spacing: 1.2px;
  font-size: 12px; color: var(--text-muted);
  margin: 20px 0 8px;
}
.ex-row { display: flex; align-items: center; gap: 12px; }
.checkbox {
  width: 44px; height: 44px; min-width: 44px; border-radius: 8px;
  border: 2px dashed var(--text-muted); background: var(--panel-2);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 900; color: transparent; transition: all 0.15s ease;
}
.checkbox.checked {
  border: 2px solid var(--gold); background: var(--gold); color: #14161a;
  transform: rotate(-2deg); box-shadow: 0 0 0 3px rgba(201,162,39,0.18);
}
.ex-name { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; }
.ex-target {
  font-family: "SFMono-Regular", Consolas, monospace;
  color: var(--text-muted); font-size: 11px; display: block; margin-top: 2px;
}
.inputs { display: flex; gap: 6px; }
.inputs input {
  width: 58px; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text);
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 16px; text-align: center; padding: 9px 2px; min-height: 44px;
}
.inputs label {
  font-size: 9px; color: var(--text-muted); text-transform: uppercase;
  display: block; text-align: center; margin-bottom: 2px;
}
.empty { color: var(--text-muted); text-align: center; padding: 34px 12px; font-size: 14px; }
.add-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label {
  font-size: 10px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.5px;
}
.field input, .field select {
  background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); padding: 9px 8px; font-size: 14px;
}
.field.name input { width: 150px; }
.field.num input, .field.num select { width: 68px; }
.add-btn {
  background: var(--accent); border: none; color: white; font-weight: 800;
  text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px;
  padding: 12px 16px; border-radius: 6px; cursor: pointer; min-height: 44px;
  display: flex; align-items: center; gap: 6px;
}
.plan-item { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.plan-item .name-input {
  flex: 1; min-width: 100px; background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 6px; color: var(--text);
  font-weight: 700; padding: 9px; font-size: 14px;
}
.trash-btn {
  background: none; border: 1px solid var(--border); color: var(--accent);
  border-radius: 6px; padding: 11px 13px; cursor: pointer; font-size: 14px;
  min-height: 44px;
}
.stat-row { display: flex; gap: 10px; margin-bottom: 14px; }
.stat {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; flex: 1; min-width: 0;
}
.stat .num {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 22px; font-weight: 700; color: var(--gold); white-space: nowrap;
}
.stat .lbl {
  font-size: 10px; text-transform: uppercase;
  color: var(--text-muted); letter-spacing: 0.5px;
}
select.ex-picker {
  width: 100%; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); padding: 11px;
  font-weight: 700; margin-bottom: 12px; font-size: 14px;
}
.save-warn {
  background: rgba(232,67,43,0.12); border: 1px solid var(--accent);
  color: var(--accent); padding: 8px 12px; border-radius: 8px;
  font-size: 12px; margin-bottom: 12px;
}
.preview-note {
  background: rgba(201,162,39,0.10); border: 1px solid rgba(201,162,39,0.4);
  color: var(--gold); padding: 8px 12px; border-radius: 8px;
  font-size: 12px; margin-bottom: 12px; line-height: 1.5;
}
.day-banner {
  font-family: "Arial Narrow", "Helvetica Neue Condensed", sans-serif;
  font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px;
  font-size: 15px; color: var(--gold);
  border-left: 3px solid var(--gold); padding-left: 10px; margin-bottom: 14px;
}
.day-pills { display: flex; gap: 6px; margin-bottom: 14px; }
.day-pill {
  flex: 1; background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text-muted);
  font-family: "Arial Narrow", sans-serif; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.5px; font-size: 13px;
  padding: 11px 2px 9px; cursor: pointer; min-height: 50px;
  display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0;
}
.day-pill.active {
  border-color: var(--gold); color: var(--text); background: var(--panel-2);
  box-shadow: 0 0 0 2px rgba(201,162,39,0.16);
}
.day-pill .pill-count {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 9px; font-weight: 400; color: var(--gold);
  text-transform: lowercase; letter-spacing: 0;
}
.day-pill.rest .pill-count { color: var(--text-muted); }

/* ---- weekly overview ---- */
.week-strip { display: flex; gap: 5px; margin-bottom: 6px; }
.week-cell {
  flex: 1; min-width: 0; text-align: center; cursor: pointer;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 2px 7px;
}
.week-cell.sel { border-color: var(--text); }
.week-cell.is-today { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(201,162,39,0.14); }
.week-cell .wd {
  font-family: "Arial Narrow", sans-serif; font-weight: 800;
  text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px;
  color: var(--text-muted); margin-bottom: 5px;
}
.week-cell.is-today .wd { color: var(--text); }
.mark {
  width: 18px; height: 18px; margin: 0 auto; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 900; line-height: 1;
}
.mark.full { background: var(--gold); color: #14161a; }
.mark.partial { border: 2px solid var(--gold); color: var(--gold); font-size: 9px; }
.mark.missed { border: 2px solid var(--accent); color: var(--accent); font-size: 10px; }
.mark.rest { border: 1px dashed var(--border); color: var(--text-muted); font-size: 13px; }
.mark.upcoming { border: 1px solid var(--border); background: var(--panel-2); }
.legend {
  display: flex; flex-wrap: wrap; gap: 12px;
  font-size: 10px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px;
}
.legend span { display: flex; align-items: center; gap: 5px; }
.legend .dot { width: 10px; height: 10px; border-radius: 3px; }
.legend .dot.full { background: var(--gold); }
.legend .dot.partial { border: 2px solid var(--gold); }
.legend .dot.missed { border: 2px solid var(--accent); }
.legend .dot.rest { border: 1px dashed var(--border); }

/* ---- consistency grid ---- */
.grid-wrap { display: flex; gap: 6px; align-items: flex-start; overflow-x: auto; padding-bottom: 4px; }
.grid-rows {
  display: flex; flex-direction: column; gap: 3px;
  font-family: "Arial Narrow", sans-serif; font-size: 10px;
  color: var(--text-muted); text-transform: uppercase; padding-top: 1px;
}
.grid-rows div { height: 14px; line-height: 14px; }
.grid-cols { display: flex; gap: 3px; }
.grid-col { display: flex; flex-direction: column; gap: 3px; }
.cellbox { width: 14px; height: 14px; border-radius: 3px; background: var(--panel-2); cursor: pointer; }
.cellbox.sel { box-shadow: 0 0 0 2px var(--text); }
.detail-card {
  background: var(--panel); border: 1px solid var(--border);
  border-left: 3px solid var(--gold);
  border-radius: 10px; padding: 14px; margin-bottom: 10px;
}
.detail-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  margin-bottom: 4px;
}
.detail-title {
  font-family: "Arial Narrow", sans-serif; font-weight: 900;
  text-transform: uppercase; letter-spacing: 1px; font-size: 15px; color: var(--text);
}
.detail-sub {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 11px; color: var(--text-muted); margin-top: 2px;
}
.close-x {
  background: none; border: 1px solid var(--border); color: var(--text-muted);
  border-radius: 6px; width: 34px; height: 34px; min-width: 34px;
  cursor: pointer; font-size: 15px; line-height: 1;
}
.log-line {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.log-line:last-child { border-bottom: none; }
.log-tick {
  width: 20px; min-width: 20px; text-align: center;
  font-weight: 900; font-size: 14px; color: var(--gold);
}
.log-tick.off { color: var(--text-muted); font-weight: 400; }
.log-body { flex: 1; min-width: 0; }
.log-name { font-weight: 700; font-size: 14px; }
.log-name.off { color: var(--text-muted); font-weight: 400; }
.log-meta {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 12px; color: var(--text-muted); margin-top: 2px;
}
.detail-foot {
  display: flex; gap: 14px; flex-wrap: wrap;
  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
  font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; color: var(--text-muted);
}
.detail-foot b { color: var(--gold); font-weight: 700; }
.del-weight-link { color: var(--accent); font-size: 11px; text-decoration: underline; }
.cellbox.full { background: var(--gold); }
.cellbox.partial { background: rgba(201,162,39,0.42); }
.cellbox.missed { background: rgba(232,67,43,0.32); }
.cellbox.rest { background: var(--panel-2); }
.cellbox.upcoming { background: transparent; border: 1px dashed var(--border); }
.nag-bar {
  background: rgba(232,67,43,0.12); border: 1px solid rgba(232,67,43,0.5);
  border-left: 4px solid var(--accent);
  border-radius: 10px; padding: 13px 15px; margin-bottom: 12px;
}
.nag-bar .msg {
  font-family: "Arial Narrow", "Helvetica Neue Condensed", sans-serif;
  font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px;
  font-size: 17px; line-height: 1.25; color: var(--accent);
}
.nag-bar .sub2 {
  font-size: 11px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.5px; margin-top: 5px;
}
textarea.msg-box {
  width: 100%; min-height: 96px; background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 6px; color: var(--text);
  padding: 10px; font-size: 16px; font-family: inherit; line-height: 1.5;
  resize: vertical;
}
.install-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: rgba(232,67,43,0.10); border: 1px solid rgba(232,67,43,0.45);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
  font-size: 13px; line-height: 1.5;
}
.install-bar .txt { flex: 1; min-width: 180px; }
.install-bar .ttl {
  font-family: "Arial Narrow", sans-serif; font-weight: 900;
  text-transform: uppercase; letter-spacing: 1px; color: var(--accent);
  font-size: 13px; display: block; margin-bottom: 2px;
}
.ghost-btn {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 11px 14px; cursor: pointer; min-height: 44px;
  font-size: 13px; font-weight: 700;
}
.backup-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hint { color: var(--text-muted); font-size: 12px; line-height: 1.5; margin-top: 8px; }
.weight-log { padding: 4px 14px; max-height: 340px; overflow-y: auto; }
.wlog-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.wlog-row:last-child { border-bottom: none; }
.wlog-date {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 13px; color: var(--text); white-space: nowrap;
}
.wlog-today {
  font-family: "Arial Narrow", sans-serif; font-size: 9px; text-transform: uppercase;
  letter-spacing: 0.5px; color: var(--gold); border: 1px solid rgba(201,162,39,0.4);
  border-radius: 20px; padding: 2px 6px; margin-left: 4px;
}
.wlog-controls { display: flex; align-items: center; gap: 6px; }
.wlog-input {
  width: 70px; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 16px; text-align: center; padding: 8px 2px; min-height: 40px;
}
.wlog-unit { font-size: 11px; color: var(--text-muted); min-width: 20px; }
.wlog-del {
  background: none; border: 1px solid var(--border); color: var(--accent);
  border-radius: 6px; width: 36px; height: 36px; cursor: pointer; font-size: 13px;
}
.chart-card { height: 260px; }
.chart-svg { width: 100%; height: 100%; display: block; }
.chart-axis-label {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 10px; fill: var(--text-muted);
}
</style>
</head>

  function saveTodayWeight() {

  // ---------- derived ----------
  function cutoff90() { return daysAgoStr(90); }

  function dayStatus(dateStr) {
    var t = todayStr();
    var dow = dowOf(dateStr);
    var planned = planFor(dow).length;
    var done = state.logs.filter(function (l) { return l.date === dateStr && l.completed; }).length;
    if (dateStr > t) return planned > 0 ? "upcoming" : "rest";
    if (done > 0) return (planned > 0 && done < planned) ? "partial" : "full";
    if (planned === 0) return "rest";
    return dateStr === t ? "upcoming" : "missed";
  }

  function thisWeekDates() {
    var mon = mondayOfThisWeek(), out = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(mon);
      d.setDate(mon.getDate() + i);
      out.push(toKey(d));
    }
    return out;
  }

  function trainedDays90() {
    var cutoff = cutoff90();
    var set = {};
    state.logs.forEach(function (l) {
      if (l.date >= cutoff && l.completed) set[l.date] = true;
    });
    return Object.keys(set).length;
  }

  function plannedDays90() {
    var count = 0;
    for (var i = 0; i < 90; i++) {
      var ds = daysAgoStr(i);
      if (planFor(dowOf(ds)).length > 0) count++;
    }
    return count;
  }

  function adherence90() {
    var planned = plannedDays90();
    if (!planned) return null;
    return Math.round((trainedDays90() / planned) * 100);
  }

  function currentStreak() {
    // consecutive days back from today that were either trained or scheduled rest
    var streak = 0;
    for (var i = 0; i < 180; i++) {
      var ds = daysAgoStr(i);
      var st = dayStatus(ds);
      if (i === 0 && (st === "missed" || st === "upcoming")) continue; // today still open
      if (st === "missed") break;
      if (st === "full" || st === "partial") streak++;
      else if (st === "rest") continue;
    }
    return streak;
  }

  function chartDataForKey(key) {
    var cutoff = cutoff90();
    return state.logs
      .filter(function (l) { return logKey(l) === key && l.date >= cutoff && l.completed; })
      .sort(function (a, b) { return a.date > b.date ? 1 : -1; })
      .map(function (l) { return { date: l.date, label: fmtDate(l.date), value: l.weight }; });
  }
  function weightChartData() {
    var cutoff = cutoff90();
    return state.weightLogs
      .filter(function (w) { return w.date >= cutoff; })
      .sort(function (a, b) { return a.date > b.date ? 1 : -1; })
      .map(function (w) { return { date: w.date, label: fmtDate(w.date), value: w.weight }; });
  }
  function prForKey(key) {
    var cutoff = cutoff90(), best = null;
    state.logs.forEach(function (l) {
      if (logKey(l) === key && l.date >= cutoff && l.completed) {
        if (best == null || l.weight > best) best = l.weight;
      }
    });
    return best;
  }
  function computeBMI() {
    var h = parseNum(state.profile.height);
    var wd = weightChartData();
    var w = wd.length ? wd[wd.length - 1].value : null;
    if (!h || !w) return null;
    var hM = state.profile.heightUnit === "cm" ? h / 100 : h * 0.0254;
    var wKg = state.profile.weightUnit === "kg" ? w : w * 0.453592;
    if (!hM) return null;
    return (wKg / (hM * hM)).toFixed(1);
  }
  function dayTitle(dow) {
    var label = (state.dayLabels[dow] || "").trim();
    return label ? dayNames()[dow] + " \u00b7 " + label : dayNames()[dow];
  }

  // ---------- chart ----------
  function lineChartSVG(data, color) {
    var w = 600, h = 220, padL = 40, padR = 10, padT = 14, padB = 24;
    if (!data.length) return "";
    var values = data.map(function (d) { return d.value; });
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    if (min === max) { min -= 1; max += 1; }
    var pad = (max - min) * 0.12;
    min -= pad; max += pad;
    var xStep = data.length > 1 ? (w - padL - padR) / (data.length - 1) : 0;
    function scaleY(v) { return padT + (h - padT - padB) * (1 - (v - min) / (max - min)); }
    var points = data.map(function (d, i) { return [padL + i * xStep, scaleY(d.value)]; });
    var pathD = points.map(function (p, i) {
      return (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1);
    }).join(" ");
    var grid = [0, 0.5, 1].map(function (f) {
      var y = padT + (h - padT - padB) * f;
      return '<line x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '" stroke="#2b2f35" stroke-dasharray="3,3" />';
    }).join("");
    var yLab = [max, (max + min) / 2, min].map(function (v, i) {
      var y = padT + (h - padT - padB) * (i * 0.5);
      return '<text x="2" y="' + (y + 4) + '" class="chart-axis-label">' + v.toFixed(1) + "</text>";
    }).join("");
    var step = Math.max(1, Math.ceil(data.length / 6));
    var xLab = data.map(function (d, i) {
      if (i % step !== 0 && i !== data.length - 1) return "";
      return '<text x="' + points[i][0] + '" y="' + (h - 6) + '" text-anchor="middle" class="chart-axis-label">' + d.label + "</text>";
    }).join("");
    var dots = points.map(function (p) {
      return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.5" fill="' + color + '" />';
    }).join("");
    return '<svg class="chart-svg" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none">' +
      grid + yLab + xLab + '<path d="' + pathD + '" fill="none" stroke="' + color +
      '" stroke-width="2.5" />' + dots + "</svg>";
  }

    if (state.selectedDate) html += dayDetailHTML(state.selectedDate);

    if (all.length === 0) {
      html += '<div class="empty">' + t("addExToTrackProgress") + "</div>";
      return html;
    }

    var current = all.find(function (e) { return e.key === state.progressExKey; }) || all[0];
    var data = chartDataForKey(current.key);
    var pr = prForKey(current.key);

    html += '<div class="section-label">' + t("liftProgress") + "</div>";
    html += '<select class="ex-picker" id="progressPicker">';
    all.forEach(function (e) {
      html += '<option value="' + esc(e.key) + '"' + (e.key === current.key ? " selected" : "") + ">" + esc(e.name) + "</option>";
    });
    html += "</select>";

    html += '<div class="stat-row">' +
      '<div class="stat"><div class="num">' + (pr != null ? pr + current.unit : "-") + '</div><div class="lbl">' + t("best90") + '</div></div>' +
      '<div class="stat"><div class="num">' + data.length + '</div><div class="lbl">' + t("loggedSessions") + "</div></div></div>";

    html += '<div class="card chart-card">' +
      (data.length === 0
        ? '<div class="empty">' + t("noLogsFor90d") + "</div>"
        : lineChartSVG(data, "#c9a227")) + "</div>";
    return html;
  }

  function renderProfile() {
    var wd = weightChartData();
    var latest = wd.length ? wd[wd.length - 1].value : null;
    var start = wd.length ? wd[0].value : null;
    var change = (latest != null && start != null) ? latest - start : null;
    var bmi = computeBMI();
    var g = state.profile.gender || "";

    var html = '<div class="card"><div class="add-form">' +
      '<div class="field name"><label>' + t("name") + '</label><input id="profName" placeholder="' + t("yourName") + '" value="' + esc(state.profile.name) + '" /></div>' +
      '<div class="field num"><label>' + t("gender") + '</label><select id="profGender">' +
      '<option value=""' + (g === "" ? " selected" : "") + ">" + t("genderUnset") + "</option>" +
      '<option value="male"' + (g === "male" ? " selected" : "") + ">" + t("genderMale") + "</option>" +
      '<option value="female"' + (g === "female" ? " selected" : "") + ">" + t("genderFemale") + "</option>" +
      "</select></div>" +
      '<div class="field num"><label>' + t("height") + '</label><input id="profHeight" type="text" inputmode="decimal" class="dec-input" pattern="[0-9]*[.,]?[0-9]*" value="' + esc(state.profile.height) + '" /></div>' +
      '<div class="field num"><label>' + t("unit") + '</label><select id="profHeightUnit">' +
      '<option value="cm"' + (state.profile.heightUnit === "cm" ? " selected" : "") + ">cm</option>" +
      '<option value="in"' + (state.profile.heightUnit === "in" ? " selected" : "") + ">in</option>" +
      "</select></div>" +
      '<div class="field num"><label>' + t("wtUnit") + '</label><select id="profWeightUnit">' +
      '<option value="kg"' + (state.profile.weightUnit === "kg" ? " selected" : "") + ">kg</option>" +
      '<option value="lb"' + (state.profile.weightUnit === "lb" ? " selected" : "") + ">lb</option>" +
      "</select></div>" +
      '<div class="field num"><label>' + t("language") + '</label><select id="profLang">' +
      '<option value="en"' + (state.lang === "en" ? " selected" : "") + ">English</option>" +
      '<option value="sr"' + (state.lang === "sr" ? " selected" : "") + ">Srpski</option>" +
      "</select></div>" +
      "</div></div>";

    var changeColor = change > 0 ? "#e8432b" : (change < 0 ? "#c9a227" : "var(--text-muted)");
    html += '<div class="stat-row">' +
      '<div class="stat"><div class="num">' + (latest != null ? latest + state.profile.weightUnit : "-") + '</div><div class="lbl">' + t("currentWeight") + '</div></div>' +
      '<div class="stat"><div class="num" style="color:' + changeColor + '">' +
      (change != null ? (change > 0 ? "+" : "") + change.toFixed(1) : "-") + '</div><div class="lbl">' + t("change90") + '</div></div>' +
      '<div class="stat"><div class="num">' + (bmi != null ? bmi : "-") + '</div><div class="lbl">' + t("bmi") + "</div></div></div>";

    html += '<div class="card"><div class="add-form">' +
      '<div class="field num"><label>' + t("logWeightToday") + '</label><input id="todayWeightInput" type="text" inputmode="decimal" class="dec-input" pattern="[0-9]*[.,]?[0-9]*" value="' + esc(state.todayWeightInput) + '" /></div>' +
      '<button class="add-btn" id="saveWeightBtn">' + t("save") + "</button>" +
      "</div></div>";

    html += '<div class="card chart-card">' +
      (wd.length === 0
        ? '<div class="empty">' + t("noWeightYet") + "</div>"
        : lineChartSVG(wd, "#e8432b")) + "</div>";

    if (wd.length > 0) {
      html += '<div class="hint" style="margin:-4px 0 8px">' + t("tapToFix") + "</div>";
      html += '<div class="card weight-log">';
      wd.slice().reverse().forEach(function (w, i) {
        var isToday = w.date === todayStr();
        html += '<div class="wlog-row' + (i === 0 ? "" : "") + '">' +
          '<div class="wlog-date">' + esc(w.label) + (isToday ? ' <span class="wlog-today">' + t("today") + "</span>" : "") + "</div>" +
          '<div class="wlog-controls">' +
          '<input type="text" inputmode="decimal" class="dec-input wlog-input" pattern="[0-9]*[.,]?[0-9]*" data-wdate="' + w.date + '" value="' + w.value + '" />' +
          '<span class="wlog-unit">' + esc(state.profile.weightUnit) + "</span>" +
          '<button class="wlog-del" data-wdate="' + w.date + '" aria-label="' + t("remove") + '">&#10005;</button>' +
          "</div></div>";
      });
      html += "</div>";
    }

    html += '<div class="section-label">' + t("dailyReminder") + "</div>";
    var perm = notifPermission();
    var on = state.reminders.enabled && perm === "granted";
    var hh = String(state.reminders.hour).padStart(2, "0");
    var mm = String(state.reminders.minute).padStart(2, "0");
    var statusLine;
    if (perm === "unsupported") statusLine = t("notifUnsupported");
    else if (perm === "denied") statusLine = t("notifBlocked");
    else if (on) statusLine = t("notifOn") + hh + ":" + mm + t("notifOnSuffix");
    else statusLine = t("notifOff");

    html += '<div class="card">' +
      '<div class="detail-sub" style="margin-bottom:12px">' + esc(statusLine) + "</div>" +
      '<div class="backup-row">' +
      (on
        ? '<button class="ghost-btn" id="remOff">' + t("turnOff") + "</button>"
        : '<button class="add-btn" id="remOn">' + t("turnOn") + "</button>") +
      '<div class="field num" style="width:auto"><label>' + t("time") + '</label>' +
      '<input type="time" id="remTime" value="' + hh + ":" + mm + '" style="width:120px" /></div>' +
      '<button class="ghost-btn" id="remTest">' + t("testIt") + "</button>" +
      "</div>" +
      '<div class="hint" style="margin-top:12px">' + t("fixedMsgNote") + "</div>" +
      '<div class="hint">' + t("bgLimitNote") + "</div>" +
      "</div>";

    html += '<div class="section-label">' + t("backup") + "</div>";
    html += '<div class="card">' +
      '<div class="backup-row">' +
      '<button class="ghost-btn" id="exportBtn">' + t("saveBackup") + "</button>" +
      '<button class="ghost-btn" id="copyBtn">' + t("copyBackup") + "</button>" +
      '<button class="ghost-btn" id="importBtn">' + t("restoreBackup") + "</button>" +
      '<input type="file" id="importFile" accept="application/json,.json" style="display:none" />' +
      "</div>" +
      '<div class="hint">' + t("backupNote") + "</div>" +
      "</div>";
    return html;
  }

  // ---------- listeners ----------
  function attachListeners() {
    // Any field meant for a decimal number: convert a typed comma to a period
    // as they type, so a keyboard that only has "," still produces a valid number.
    app.querySelectorAll(".dec-input").forEach(function (el) {
      el.addEventListener("input", function () {
        if (el.value.indexOf(",") === -1) return;
        var pos = el.selectionStart;
        el.value = el.value.replace(/,/g, ".");
        try { el.setSelectionRange(pos, pos); } catch (e) {}
      });
    });

    app.querySelectorAll("[data-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.tab = btn.getAttribute("data-tab");
        state.selectedDate = null;
        render();
      });
    });
    app.querySelectorAll("[data-date]").forEach(function (el) {
      el.addEventListener("click", function () {
        var ds = el.getAttribute("data-date");
        state.selectedDate = (state.selectedDate === ds) ? null : ds;
        render();
      });
    });
    var closeDetail = document.getElementById("closeDetail");
    if (closeDetail) {
      closeDetail.addEventListener("click", function () { state.selectedDate = null; render(); });
    }
    app.querySelectorAll(".del-weight-link").forEach(function (el) {
      el.addEventListener("click", function (ev) {
        ev.preventDefault();
        clearWeightForDate(el.getAttribute("data-date"));
      });
    });
    app.querySelectorAll("[data-planday]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.planDay = Number(btn.getAttribute("data-planday"));
        render();
      });
    });
    app.querySelectorAll('[data-action="toggle"]').forEach(function (el) {
      el.addEventListener("click", function () {
        var ex = todayPlan().find(function (e) { return e.id === el.getAttribute("data-id"); });
        if (ex) toggleComplete(ex);
      });
    });
    app.querySelectorAll("input[data-field]").forEach(function (el) {
      el.addEventListener("input", function () {
        var id = el.getAttribute("data-id"), f = el.getAttribute("data-field"), p = {};
        p[f] = el.value;
        state.todayInputs[id] = Object.assign({}, state.todayInputs[id], p);
      });
      el.addEventListener("blur", function () {
        var ex = todayPlan().find(function (e) { return e.id === el.getAttribute("data-id"); });
        if (ex) saveTodayLog(ex);
      });
    });

    var dayLabelEl = document.getElementById("dayLabel");
    if (dayLabelEl) {
      var lh = function () { state.dayLabels[state.planDay] = dayLabelEl.value; persistDayLabels(); };
      dayLabelEl.addEventListener("change", lh);
      dayLabelEl.addEventListener("blur", lh);
    }
    var copyFromEl = document.getElementById("copyFrom");
    if (copyFromEl) {
      copyFromEl.addEventListener("change", function () {
        if (copyFromEl.value !== "") copyDay(Number(copyFromEl.value));
      });
    }
    var clearBtn = document.getElementById("clearDayBtn");
    if (clearBtn) clearBtn.addEventListener("click", function () { clearDay(state.planDay); });

    var addBtn = document.getElementById("addExBtn");
    if (addBtn) {
      [["newExName", "name"], ["newExSets", "sets"], ["newExReps", "reps"], ["newExWeight", "weight"], ["newExUnit", "unit"]]
        .forEach(function (pair) {
          var el = document.getElementById(pair[0]);
          if (!el) return;
          var h = function () { state.newEx[pair[1]] = el.value; };
          el.addEventListener("input", h);
          el.addEventListener("change", h);
        });
      addBtn.addEventListener("click", addExercise);
    }
    app.querySelectorAll('[data-action="remove"]').forEach(function (el) {
      el.addEventListener("click", function () {
        removeExercise(Number(el.getAttribute("data-dow")), el.getAttribute("data-id"));
      });
    });
    app.querySelectorAll("[data-plan-id]").forEach(function (el) {
      var h = function () {
        updatePlanField(Number(el.getAttribute("data-plan-dow")), el.getAttribute("data-plan-id"),
          el.getAttribute("data-plan-field"), el.value);
      };
      el.addEventListener("change", h);
      el.addEventListener("blur", h);
    });

    var picker = document.getElementById("progressPicker");
    if (picker) picker.addEventListener("change", function () { state.progressExKey = picker.value; render(); });

    function bind(id, key, rerender) {
      var el = document.getElementById(id);
      if (!el) return;
      var h = function () { state.profile[key] = el.value; persistProfile(); if (rerender) render(); };
      el.addEventListener("change", h);
      if (!rerender) el.addEventListener("blur", h);
    }
    bind("profName", "name", false);
    bind("profHeight", "height", false);
    bind("profHeightUnit", "heightUnit", true);
    bind("profWeightUnit", "weightUnit", true);

    var profGender = document.getElementById("profGender");
    if (profGender) {
      profGender.addEventListener("change", function () {
        state.profile.gender = profGender.value;
        persistProfile();
        sessionMessage = null; // pick a fresh message that matches the new gender
        pushConfigToSW();
        render();
      });
    }

    var profLang = document.getElementById("profLang");
    if (profLang) {
      profLang.addEventListener("change", function () {
        state.lang = profLang.value;
        persistLang();
        render();
      });
    }

    var twi = document.getElementById("todayWeightInput");
    if (twi) {
      twi.addEventListener("input", function () { state.todayWeightInput = twi.value; });
      twi.addEventListener("blur", saveTodayWeight);
    }
    var swb = document.getElementById("saveWeightBtn");
    if (swb) swb.addEventListener("click", saveTodayWeight);

    app.querySelectorAll(".wlog-input").forEach(function (el) {
      var commit = function () { editWeightForDate(el.getAttribute("data-wdate"), el.value); };
      el.addEventListener("change", commit);
      el.addEventListener("blur", commit);
    });
    app.querySelectorAll(".wlog-del").forEach(function (el) {
      el.addEventListener("click", function () { clearWeightForDate(el.getAttribute("data-wdate")); });
    });

    var installBtn = document.getElementById("installBtn");
    if (installBtn) {
      installBtn.addEventListener("click", function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () {
          deferredPrompt = null;
          render();
        });
      });
    }
    var dismissBtn = document.getElementById("dismissInstall");
    if (dismissBtn) {
      dismissBtn.addEventListener("click", function () { installDismissed = true; render(); });
    }

    var remOn = document.getElementById("remOn");
    if (remOn) remOn.addEventListener("click", enableReminders);
    var remOff = document.getElementById("remOff");
    if (remOff) remOff.addEventListener("click", disableReminders);

    var remTime = document.getElementById("remTime");
    if (remTime) {
      remTime.addEventListener("change", function () {
        var parts = String(remTime.value || "").split(":");
        if (parts.length !== 2) return;
        var h = parseInt2(parts[0]), m = parseInt2(parts[1]);
        if (h < 0 || h > 23 || m < 0 || m > 59) return;
        state.reminders.hour = h;
        state.reminders.minute = m;
        state.reminders.lastNotified = "";
        persistReminders();
        scheduleReminder();
        render();
      });
    }

    var remTest = document.getElementById("remTest");
    if (remTest) {
      remTest.addEventListener("click", function () {
        if (notifPermission() === "granted") {
          showNotification(pickMessage());
          flash("Sent. If nothing appeared, notifications are blocked in your phone settings.");
        } else {
          flash(pickMessage());
        }
      });
    }

    var exportBtn = document.getElementById("exportBtn");
    if (exportBtn) exportBtn.addEventListener("click", exportData);

    var copyBtn = document.getElementById("copyBtn");
    if (copyBtn) {
      copyBtn.addEventListener("click", function () {
        copyText(JSON.stringify({
          app: "IronLog", version: 1, exportedAt: new Date().toISOString(),
          data: {
            ironlog_week: state.week,
            ironlog_day_labels: state.dayLabels,
            ironlog_logs: state.logs,
            ironlog_profile: state.profile,
            ironlog_weight_logs: state.weightLogs,
            ironlog_reminders: state.reminders
          }
        }, null, 2));
      });
    }

    var importBtn = document.getElementById("importBtn");
    var importFile = document.getElementById("importFile");
    if (importBtn && importFile) {
      importBtn.addEventListener("click", function () { importFile.click(); });
      importFile.addEventListener("change", function () {
        var f = importFile.files && importFile.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () { importData(String(reader.result)); };
        reader.onerror = function () { flash("Could not read that file."); };
        reader.readAsText(f);
      });
    }
  }

  render();

  scheduleReminder();
  maybeNotifyNow();
  try {
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) {
        refreshTodayInputs();
        maybeNotifyNow();
        scheduleReminder();
        render();
        if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistration) {
          navigator.serviceWorker.getRegistration().then(function (reg) {
            if (reg) reg.update().catch(function () {});
          }).catch(function () {});
        }
      }
    });
  } catch (e) {}

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" })
        .then(function (reg) {
          pushConfigToSW();
          if (state.reminders.enabled) registerPeriodicSync();
          reg.update().catch(function () {});
        }).catch(function () {});
    });
  }
})();
</script>
</body>
</html>
