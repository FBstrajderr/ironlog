<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>IronLog</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#14161a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="IronLog" />
<meta name="format-detection" content="telephone=no" />
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />

<style>
:root {
  --bg: #14161a;
  --panel: #1c1f24;
  --panel-2: #22262b;
  --border: #2b2f35;
  --text: #f0f0ec;
  --text-muted: #8a9099;
  --accent: #e8432b;
  --gold: #c9a227;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  min-height: 100%;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: contain;
}
button, .checkbox, .day-pill, .tab-btn, .week-cell {
  -webkit-user-select: none; user-select: none;
}
/* 16px minimum stops iOS Safari zooming in when a field is focused */
input, select, textarea { font-size: 16px; }
#app {
  min-height: 100vh;
  max-width: 620px;
  margin: 0 auto;
  padding: max(20px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
}
h1 {
  font-family: "Arial Narrow", "Helvetica Neue Condensed", sans-serif;
  font-weight: 900; font-size: 30px; letter-spacing: 1px;
  margin: 0; text-transform: uppercase;
}
h1 .accent { color: var(--accent); }
.head { margin-bottom: 18px; }
.sub {
  color: var(--text-muted); font-size: 12px;
  letter-spacing: 0.5px; text-transform: uppercase; margin-top: 2px;
}
.tabs {
  display: flex; gap: 4px; margin-bottom: 18px;
  border-bottom: 1px solid var(--border); overflow-x: auto;
}
.tab-btn {
  background: none; border: none; color: var(--text-muted);
  font-family: "Arial Narrow", sans-serif; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.8px; font-size: 14px;
  padding: 13px 13px; cursor: pointer; border-bottom: 3px solid transparent;
  display: flex; align-items: center; gap: 6px; white-space: nowrap; min-height: 46px;
}
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px; margin-bottom: 10px;
}
.section-label {
  font-family: "Arial Narrow", sans-serif; font-weight: 800;
  text-transform: uppercase; letter-spacing: 1.2px;
  font-size: 12px; color: var(--text-muted);
  margin: 20px 0 8px;
}
.ex-row { display: flex; align-items: center; gap: 12px; }
.checkbox {
  width: 44px; height: 44px; min-width: 44px; border-radius: 8px;
  border: 2px dashed var(--text-muted); background: var(--panel-2);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 900; color: transparent; transition: all 0.15s ease;
}
.checkbox.checked {
  border: 2px solid var(--gold); background: var(--gold); color: #14161a;
  transform: rotate(-2deg); box-shadow: 0 0 0 3px rgba(201,162,39,0.18);
}
.ex-name { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; }
.ex-target {
  font-family: "SFMono-Regular", Consolas, monospace;
  color: var(--text-muted); font-size: 11px; display: block; margin-top: 2px;
}
.inputs { display: flex; gap: 6px; }
.inputs input {
  width: 58px; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text);
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 16px; text-align: center; padding: 9px 2px; min-height: 44px;
}
.inputs label {
  font-size: 9px; color: var(--text-muted); text-transform: uppercase;
  display: block; text-align: center; margin-bottom: 2px;
}
.empty { color: var(--text-muted); text-align: center; padding: 34px 12px; font-size: 14px; }
.add-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label {
  font-size: 10px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.5px;
}
.field input, .field select {
  background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); padding: 9px 8px; font-size: 14px;
}
.field.name input { width: 150px; }
.field.num input, .field.num select { width: 68px; }
.add-btn {
  background: var(--accent); border: none; color: white; font-weight: 800;
  text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px;
  padding: 12px 16px; border-radius: 6px; cursor: pointer; min-height: 44px;
  display: flex; align-items: center; gap: 6px;
}
.plan-item { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.plan-item .name-input {
  flex: 1; min-width: 100px; background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 6px; color: var(--text);
  font-weight: 700; padding: 9px; font-size: 14px;
}
.trash-btn {
  background: none; border: 1px solid var(--border); color: var(--accent);
  border-radius: 6px; padding: 11px 13px; cursor: pointer; font-size: 14px;
  min-height: 44px;
}
.stat-row { display: flex; gap: 10px; margin-bottom: 14px; }
.stat {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; flex: 1; min-width: 0;
}
.stat .num {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 22px; font-weight: 700; color: var(--gold); white-space: nowrap;
}
.stat .lbl {
  font-size: 10px; text-transform: uppercase;
  color: var(--text-muted); letter-spacing: 0.5px;
}
select.ex-picker {
  width: 100%; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); padding: 11px;
  font-weight: 700; margin-bottom: 12px; font-size: 14px;
}
.save-warn {
  background: rgba(232,67,43,0.12); border: 1px solid var(--accent);
  color: var(--accent); padding: 8px 12px; border-radius: 8px;
  font-size: 12px; margin-bottom: 12px;
}
.preview-note {
  background: rgba(201,162,39,0.10); border: 1px solid rgba(201,162,39,0.4);
  color: var(--gold); padding: 8px 12px; border-radius: 8px;
  font-size: 12px; margin-bottom: 12px; line-height: 1.5;
}
.day-banner {
  font-family: "Arial Narrow", "Helvetica Neue Condensed", sans-serif;
  font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px;
  font-size: 15px; color: var(--gold);
  border-left: 3px solid var(--gold); padding-left: 10px; margin-bottom: 14px;
}
.day-pills { display: flex; gap: 6px; margin-bottom: 14px; }
.day-pill {
  flex: 1; background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text-muted);
  font-family: "Arial Narrow", sans-serif; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.5px; font-size: 13px;
  padding: 11px 2px 9px; cursor: pointer; min-height: 50px;
  display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0;
}
.day-pill.active {
  border-color: var(--gold); color: var(--text); background: var(--panel-2);
  box-shadow: 0 0 0 2px rgba(201,162,39,0.16);
}
.day-pill .pill-count {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 9px; font-weight: 400; color: var(--gold);
  text-transform: lowercase; letter-spacing: 0;
}
.day-pill.rest .pill-count { color: var(--text-muted); }

/* ---- weekly overview ---- */
.week-strip { display: flex; gap: 5px; margin-bottom: 6px; }
.week-cell {
  flex: 1; min-width: 0; text-align: center; cursor: pointer;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 2px 7px;
}
.week-cell.sel { border-color: var(--text); }
.week-cell.is-today { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(201,162,39,0.14); }
.week-cell .wd {
  font-family: "Arial Narrow", sans-serif; font-weight: 800;
  text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px;
  color: var(--text-muted); margin-bottom: 5px;
}
.week-cell.is-today .wd { color: var(--text); }
.mark {
  width: 18px; height: 18px; margin: 0 auto; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 900; line-height: 1;
}
.mark.full { background: var(--gold); color: #14161a; }
.mark.partial { border: 2px solid var(--gold); color: var(--gold); font-size: 9px; }
.mark.missed { border: 2px solid var(--accent); color: var(--accent); font-size: 10px; }
.mark.rest { border: 1px dashed var(--border); color: var(--text-muted); font-size: 13px; }
.mark.upcoming { border: 1px solid var(--border); background: var(--panel-2); }
.legend {
  display: flex; flex-wrap: wrap; gap: 12px;
  font-size: 10px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px;
}
.legend span { display: flex; align-items: center; gap: 5px; }
.legend .dot { width: 10px; height: 10px; border-radius: 3px; }
.legend .dot.full { background: var(--gold); }
.legend .dot.partial { border: 2px solid var(--gold); }
.legend .dot.missed { border: 2px solid var(--accent); }
.legend .dot.rest { border: 1px dashed var(--border); }

/* ---- consistency grid ---- */
.grid-wrap { display: flex; gap: 6px; align-items: flex-start; overflow-x: auto; padding-bottom: 4px; }
.grid-rows {
  display: flex; flex-direction: column; gap: 3px;
  font-family: "Arial Narrow", sans-serif; font-size: 10px;
  color: var(--text-muted); text-transform: uppercase; padding-top: 1px;
}
.grid-rows div { height: 14px; line-height: 14px; }
.grid-cols { display: flex; gap: 3px; }
.grid-col { display: flex; flex-direction: column; gap: 3px; }
.cellbox { width: 14px; height: 14px; border-radius: 3px; background: var(--panel-2); cursor: pointer; }
.cellbox.sel { box-shadow: 0 0 0 2px var(--text); }
.detail-card {
  background: var(--panel); border: 1px solid var(--border);
  border-left: 3px solid var(--gold);
  border-radius: 10px; padding: 14px; margin-bottom: 10px;
}
.detail-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  margin-bottom: 4px;
}
.detail-title {
  font-family: "Arial Narrow", sans-serif; font-weight: 900;
  text-transform: uppercase; letter-spacing: 1px; font-size: 15px; color: var(--text);
}
.detail-sub {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 11px; color: var(--text-muted); margin-top: 2px;
}
.close-x {
  background: none; border: 1px solid var(--border); color: var(--text-muted);
  border-radius: 6px; width: 34px; height: 34px; min-width: 34px;
  cursor: pointer; font-size: 15px; line-height: 1;
}
.log-line {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.log-line:last-child { border-bottom: none; }
.log-tick {
  width: 20px; min-width: 20px; text-align: center;
  font-weight: 900; font-size: 14px; color: var(--gold);
}
.log-tick.off { color: var(--text-muted); font-weight: 400; }
.log-body { flex: 1; min-width: 0; }
.log-name { font-weight: 700; font-size: 14px; }
.log-name.off { color: var(--text-muted); font-weight: 400; }
.log-meta {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 12px; color: var(--text-muted); margin-top: 2px;
}
.detail-foot {
  display: flex; gap: 14px; flex-wrap: wrap;
  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
  font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; color: var(--text-muted);
}
.detail-foot b { color: var(--gold); font-weight: 700; }
.del-weight-link { color: var(--accent); font-size: 11px; text-decoration: underline; }
.cellbox.full { background: var(--gold); }
.cellbox.partial { background: rgba(201,162,39,0.42); }
.cellbox.missed { background: rgba(232,67,43,0.32); }
.cellbox.rest { background: var(--panel-2); }
.cellbox.upcoming { background: transparent; border: 1px dashed var(--border); }
.nag-bar {
  background: rgba(232,67,43,0.12); border: 1px solid rgba(232,67,43,0.5);
  border-left: 4px solid var(--accent);
  border-radius: 10px; padding: 13px 15px; margin-bottom: 12px;
}
.nag-bar .msg {
  font-family: "Arial Narrow", "Helvetica Neue Condensed", sans-serif;
  font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px;
  font-size: 17px; line-height: 1.25; color: var(--accent);
}
.nag-bar .sub2 {
  font-size: 11px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.5px; margin-top: 5px;
}
textarea.msg-box {
  width: 100%; min-height: 96px; background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 6px; color: var(--text);
  padding: 10px; font-size: 16px; font-family: inherit; line-height: 1.5;
  resize: vertical;
}
.install-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: rgba(232,67,43,0.10); border: 1px solid rgba(232,67,43,0.45);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
  font-size: 13px; line-height: 1.5;
}
.install-bar .txt { flex: 1; min-width: 180px; }
.install-bar .ttl {
  font-family: "Arial Narrow", sans-serif; font-weight: 900;
  text-transform: uppercase; letter-spacing: 1px; color: var(--accent);
  font-size: 13px; display: block; margin-bottom: 2px;
}
.ghost-btn {
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 11px 14px; cursor: pointer; min-height: 44px;
  font-size: 13px; font-weight: 700;
}
.backup-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hint { color: var(--text-muted); font-size: 12px; line-height: 1.5; margin-top: 8px; }
.weight-log { padding: 4px 14px; max-height: 340px; overflow-y: auto; }
.wlog-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.wlog-row:last-child { border-bottom: none; }
.wlog-date {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 13px; color: var(--text); white-space: nowrap;
}
.wlog-today {
  font-family: "Arial Narrow", sans-serif; font-size: 9px; text-transform: uppercase;
  letter-spacing: 0.5px; color: var(--gold); border: 1px solid rgba(201,162,39,0.4);
  border-radius: 20px; padding: 2px 6px; margin-left: 4px;
}
.wlog-controls { display: flex; align-items: center; gap: 6px; }
.wlog-input {
  width: 70px; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 16px; text-align: center; padding: 8px 2px; min-height: 40px;
}
.wlog-unit { font-size: 11px; color: var(--text-muted); min-width: 20px; }
.wlog-del {
  background: none; border: 1px solid var(--border); color: var(--accent);
  border-radius: 6px; width: 36px; height: 36px; cursor: pointer; font-size: 13px;
}
.chart-card { height: 260px; }
.chart-svg { width: 100%; height: 100%; display: block; }
.chart-axis-label {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 10px; fill: var(--text-muted);
}
.week-badges-row { display: flex; gap: 5px; }
.week-badge {
  flex: 1; min-width: 0; height: 26px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 900; background: var(--panel-2); color: var(--text-muted);
}
.week-badge.hit { background: var(--gold); color: #14161a; }
.week-badge.miss { border: 1px solid var(--accent); color: var(--accent); background: transparent; }
.week-badge.live { border: 1px dashed var(--border); color: var(--text-muted); background: transparent; }
.checkbox.disabled { opacity: 0.4; cursor: default; }
.lb-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.lb-row:last-child { border-bottom: none; }
.lb-row.me { background: rgba(201,162,39,0.10); margin: 0 -14px; padding: 10px 14px; border-radius: 6px; }
.lb-name { font-size: 14px; color: var(--text); font-weight: 600; }
.lb-you { font-size: 10px; color: var(--text-muted); margin-left: 4px; }
.lb-value { font-family: "SFMono-Regular", Consolas, monospace; font-size: 14px; font-weight: 800; color: var(--gold); }
.swap-btn {
  background: none; border: 1px solid var(--border); color: var(--text-muted);
  border-radius: 6px; padding: 11px 13px; cursor: pointer; font-size: 15px;
  min-height: 44px;
}
.swap-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; width: 100%; }
select.swap-picker {
  flex: 1; min-width: 130px; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); padding: 9px; font-weight: 700; font-size: 13px;
}
.swap-row .swap-name-input {
  flex: 1; min-width: 100px; background: var(--panel-2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-weight: 700; padding: 9px; font-size: 14px;
}
</style>

<body>
<div id="app"></div>

<!--
  Friends / Leaderboard cloud sync (optional).
  This is completely off unless FIREBASE_CONFIG below is filled in, and the
  rest of the app works exactly the same either way -- your workouts always
  stay on this device first. See README.md for step-by-step setup.
-->
<script>
  // Safe no-op stub. If the Firebase module script below never runs (no
  // internet, FIREBASE_CONFIG left empty, or the CDN is unreachable), the
  // app calls these functions harmlessly and the Friends tab shows a
  // "not set up" message instead of crashing anything.
  window.IronLogCloud = window.IronLogCloud || {
    configured: false,
    ready: false,
    uid: null,
    onReady: function () {},
    setName: function () { return Promise.resolve(); },
    pushRecord: function () { return Promise.resolve(); },
    pushWeeklyStatus: function () { return Promise.resolve(); },
    loadBoard: function () { return Promise.resolve({ people: {}, recordsByUser: {}, weeksByUser: {} }); }
  };
</script>
<script type="module">
  // ---- Firebase setup ----------------------------------------------------
  // 1. Create a free project at https://console.firebase.google.com
  // 2. Add a Web app to it (the </> icon) and copy the firebaseConfig object
  //    it gives you into FIREBASE_CONFIG below.
  // 3. Build -> Authentication -> Get started -> Sign-in method -> enable
  //    "Anonymous".
  // 4. Build -> Firestore Database -> Create database (production mode is
  //    fine) -> then in the "Rules" tab paste the rules from README.md.
  // Leave FIREBASE_CONFIG as null to keep this feature off.
  var FIREBASE_CONFIG = null;
  /* Example, after step 2:
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSy...",
    authDomain: "your-project.firebaseapp.com",
    projectId: "your-project",
    storageBucket: "your-project.appspot.com",
    messagingSenderId: "123456789012",
    appId: "1:123456789012:web:abcdef0123456789"
  };
  */

  if (FIREBASE_CONFIG) {
    (async function () {
      try {
        var SDK = "https://www.gstatic.com/firebasejs/12.18.0/";
        var appMod = await import(SDK + "firebase-app.js");
        var authMod = await import(SDK + "firebase-auth.js");
        var fsMod = await import(SDK + "firebase-firestore.js");

        var fbApp = appMod.initializeApp(FIREBASE_CONFIG);
        var auth = authMod.getAuth(fbApp);
        var db = fsMod.getFirestore(fbApp);
        var readyCb = null;

        authMod.onAuthStateChanged(auth, function (user) {
          if (!user) return;
          window.IronLogCloud.uid = user.uid;
          window.IronLogCloud.ready = true;
          if (readyCb) { var cb = readyCb; readyCb = null; cb(); }
        });
        authMod.signInAnonymously(auth).catch(function (e) { console.warn("IronLog cloud sign-in failed:", e); });

        window.IronLogCloud.onReady = function (cb) {
          if (window.IronLogCloud.ready) cb();
          else readyCb = cb;
        };

        window.IronLogCloud.setName = function (name) {
          var uid = window.IronLogCloud.uid;
          if (!uid) return Promise.resolve();
          return fsMod.setDoc(fsMod.doc(db, "users", uid), { name: name, updatedAt: Date.now() }, { merge: true }).catch(function () {});
        };

        window.IronLogCloud.pushRecord = function (exerciseKey, exerciseName, best, unit) {
          var uid = window.IronLogCloud.uid;
          if (!uid) return Promise.resolve();
          return fsMod.setDoc(fsMod.doc(db, "users", uid, "records", exerciseKey), {
            exerciseName: exerciseName, best: best, unit: unit, updatedAt: Date.now()
          }, { merge: true }).catch(function () {});
        };

        window.IronLogCloud.pushWeeklyStatus = function (weekKey, count, goal) {
          var uid = window.IronLogCloud.uid;
          if (!uid) return Promise.resolve();
          return fsMod.setDoc(fsMod.doc(db, "users", uid, "weeks", weekKey), {
            count: count, goal: goal, updatedAt: Date.now()
          }, { merge: true }).catch(function () {});
        };

        // Reads everyone's public profile + records + weekly status. Done as
        // plain per-user subcollection reads (not a collection-group query)
        // so it works with zero Firestore index setup.
        window.IronLogCloud.loadBoard = function () {

              var recordsByUser = {}, weeksByUser = {};
              results.forEach(function (r) {
                if (r.records) recordsByUser[r.uid] = r.records;
                if (r.weeks) weeksByUser[r.uid] = r.weeks;

              return { people: people, recordsByUser: recordsByUser, weeksByUser: weeksByUser };

    if (!tpl) return;
    var tex = tpl.exercises.find(function (e) { return e.id === aex.srcExId; });
    if (!tex) return;
    var changed = false;
    if (tex.weight !== weight) { tex.weight = weight; changed = true; }
    if (tex.sets !== sets) { tex.sets = sets; changed = true; }
    if (tex.reps !== reps) { tex.reps = reps; changed = true; }
    if (changed) persistTemplates();
  }
  function saveLogForDate(dateStr, ex, overrides) {
    overrides = overrides || {};
    var cur = Object.assign({}, getDateInputs(dateStr)[ex.id], overrides);
    var entry = {
      id: uid(), date: dateStr, exerciseId: ex.id, exerciseKey: exKey(ex), exerciseName: ex.name,
      weight: parseNum(cur.weight) || 0, reps: parseInt2(cur.reps) || 0, sets: parseInt2(cur.sets) || 0,
      unit: ex.unit, completed: !!cur.completed
    };
    var idx = state.logs.findIndex(function (l) { return l.exerciseId === ex.id && l.date === dateStr; });
    if (idx >= 0) {
      var oldId = state.logs[idx].id;
      state.logs[idx] = Object.assign({}, entry, { id: oldId });
    } else {
      state.logs.push(entry);
    }
    persistLogs();
    state.dateInputs[dateStr] = state.dateInputs[dateStr] || {};
    state.dateInputs[dateStr][ex.id] = {
      weight: entry.weight, sets: entry.sets, reps: entry.reps, completed: entry.completed
    };
    syncTemplateFromLog(dateStr, ex.id, entry.weight, entry.sets, entry.reps);
    if (entry.completed) pushRecordForExercise(ex);
    pushCurrentWeekStatus();
  }
  function toggleCompleteForDate(dateStr, ex) {
    var di = getDateInputs(dateStr);
    saveLogForDate(dateStr, ex, { completed: !(di[ex.id] && di[ex.id].completed) });
    render();
  }
  function saveTodayWeight() {
    var val = parseNum(state.todayWeightInput);
    if (!String(state.todayWeightInput).trim() || val <= 0) return;
    var t = todayStr();
    var idx = state.weightLogs.findIndex(function (w) { return w.date === t; });
    if (idx >= 0) state.weightLogs[idx].weight = val;
    else state.weightLogs.push({ id: uid(), date: t, weight: val });
    state.todayWeightInput = String(val);
    persistWeightLogs();
    render();
  }
  function clearWeightForDate(dateStr) {
    state.weightLogs = state.weightLogs.filter(function (w) { return w.date !== dateStr; });
    if (dateStr === todayStr()) state.todayWeightInput = "";
    persistWeightLogs();
    render();
  }
  function editWeightForDate(dateStr, rawValue) {
    var val = parseNum(rawValue);
    if (!String(rawValue).trim() || val <= 0) return;
    var idx = state.weightLogs.findIndex(function (w) { return w.date === dateStr; });
    if (idx < 0) return;
    state.weightLogs[idx].weight = val;
    if (dateStr === todayStr()) state.todayWeightInput = String(val);
    persistWeightLogs();
    render();
  }

  // ---------- derived ----------
  function cutoff90() { return daysAgoStr(90); }

  function dayStatus(dateStr) {
    var t = todayStr();
    var planned = exercisesForDate(dateStr).length;
    var done = state.logs.filter(function (l) { return l.date === dateStr && l.completed; }).length;
    if (dateStr > t) return planned > 0 ? "upcoming" : "rest";
    if (done > 0) return (planned > 0 && done < planned) ? "partial" : "full";
    if (planned === 0) return "rest";
    return dateStr === t ? "upcoming" : "missed";
  }

  function thisWeekDates() {
    var mon = mondayOfThisWeek(), out = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(mon);
      d.setDate(mon.getDate() + i);
      out.push(toKey(d));
    }
    return out;
  }

  function trainedDays90() {
    var cutoff = cutoff90();
    var set = {};
    state.logs.forEach(function (l) {
      if (l.date >= cutoff && l.completed) set[l.date] = true;
    });
    return Object.keys(set).length;
  }

  function weeklyGoal() { return parseInt2(state.profile.weeklyGoal) || 0; }

  function weekTrainedCount(weekMonDate) {
    var count = 0, t = todayStr();
    for (var i = 0; i < 7; i++) {
      var d = new Date(weekMonDate);
      d.setDate(weekMonDate.getDate() + i);
      var ds = toKey(d);
      if (ds > t) continue;
      if (state.logs.some(function (l) { return l.date === ds && l.completed; })) count++;
    }
    return count;
  }
  function thisWeekTrainedCount() { return weekTrainedCount(mondayOfThisWeek()); }

  // hit = met the weekly goal (week fully elapsed), miss = didn't, live = week still in progress
  function weekBadgeInfo(weekMonDate) {
    var goal = weeklyGoal();
    var count = weekTrainedCount(weekMonDate);
    var lastDay = new Date(weekMonDate);
    lastDay.setDate(weekMonDate.getDate() + 6);
    var complete = toKey(lastDay) < todayStr();
    var status = !complete ? "live" : (count >= goal ? "hit" : "miss");
    return { count: count, goal: goal, status: status };
  }

  function adherence90() {
    var goal = weeklyGoal();
    if (!goal) return null;
    var expected = goal * (90 / 7);
    return Math.min(999, Math.round((trainedDays90() / expected) * 100));
  }

  function currentStreak() {
    // consecutive days back from today that were either trained or scheduled rest
    var streak = 0;
    for (var i = 0; i < 180; i++) {
      var ds = daysAgoStr(i);
      var st = dayStatus(ds);
      if (i === 0 && (st === "missed" || st === "upcoming")) continue; // today still open
      if (st === "missed") break;
      if (st === "full" || st === "partial") streak++;
      else if (st === "rest") continue;
    }
    return streak;
  }

  function chartDataForKey(key) {
    var cutoff = cutoff90();
    return state.logs
      .filter(function (l) { return logKey(l) === key && l.date >= cutoff && l.completed; })
      .sort(function (a, b) { return a.date > b.date ? 1 : -1; })
      .map(function (l) { return { date: l.date, label: fmtDate(l.date), value: l.weight }; });
  }
  function weightChartData() {
    var cutoff = cutoff90();
    return state.weightLogs
      .filter(function (w) { return w.date >= cutoff; })
      .sort(function (a, b) { return a.date > b.date ? 1 : -1; })
      .map(function (w) { return { date: w.date, label: fmtDate(w.date), value: w.weight }; });
  }
  function prForKey(key) {
    var cutoff = cutoff90(), best = null;
    state.logs.forEach(function (l) {
      if (logKey(l) === key && l.date >= cutoff && l.completed) {
        if (best == null || l.weight > best) best = l.weight;
      }
    });
    return best;
  }
  function allTimePR(key) {
    var best = null;
    state.logs.forEach(function (l) {
      if (logKey(l) === key && l.completed) {
        if (best == null || l.weight > best) best = l.weight;
      }
    });
    return best;
  }

  function cloudConfigured() { return !!(window.IronLogCloud && window.IronLogCloud.configured); }
  function cloudReady() { return cloudConfigured() && state.cloud.status === "ready"; }
  function persistFriendName() { save("ironlog_friend_name", state.cloud.name); }

  function computeBMI() {
    var h = parseNum(state.profile.height);
    var wd = weightChartData();
    var w = wd.length ? wd[wd.length - 1].value : null;
    if (!h || !w) return null;
    var hM = state.profile.heightUnit === "cm" ? h / 100 : h * 0.0254;
    var wKg = state.profile.weightUnit === "kg" ? w : w * 0.453592;
    if (!hM) return null;
    return (wKg / (hM * hM)).toFixed(1);
  }
  function labelForDate(dateStr, dow) {
    var a = state.assignments[dateStr];
    return a ? dayNames()[dow] + " \u00b7 " + (a.templateName || t("rest")) : dayNames()[dow];

  // ---------- chart ----------
  function lineChartSVG(data, color) {
    var w = 600, h = 220, padL = 40, padR = 10, padT = 14, padB = 24;
    if (!data.length) return "";
    var values = data.map(function (d) { return d.value; });
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    if (min === max) { min -= 1; max += 1; }
    var pad = (max - min) * 0.12;
    min -= pad; max += pad;
    var xStep = data.length > 1 ? (w - padL - padR) / (data.length - 1) : 0;
    function scaleY(v) { return padT + (h - padT - padB) * (1 - (v - min) / (max - min)); }
    var points = data.map(function (d, i) { return [padL + i * xStep, scaleY(d.value)]; });
    var pathD = points.map(function (p, i) {
      return (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1);
    }).join(" ");
    var grid = [0, 0.5, 1].map(function (f) {
      var y = padT + (h - padT - padB) * f;
      return '<line x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '" stroke="#2b2f35" stroke-dasharray="3,3" />';
    }).join("");
    var yLab = [max, (max + min) / 2, min].map(function (v, i) {
      var y = padT + (h - padT - padB) * (i * 0.5);
      return '<text x="2" y="' + (y + 4) + '" class="chart-axis-label">' + v.toFixed(1) + "</text>";
    }).join("");
    var step = Math.max(1, Math.ceil(data.length / 6));
    var xLab = data.map(function (d, i) {
      if (i % step !== 0 && i !== data.length - 1) return "";
      return '<text x="' + points[i][0] + '" y="' + (h - 6) + '" text-anchor="middle" class="chart-axis-label">' + d.label + "</text>";
    }).join("");
    var dots = points.map(function (p) {
      return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.5" fill="' + color + '" />';
    }).join("");
    return '<svg class="chart-svg" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none">' +
      grid + yLab + xLab + '<path d="' + pathD + '" fill="none" stroke="' + color +
      '" stroke-width="2.5" />' + dots + "</svg>";
  }

  // ---------- render ----------
  var app = document.getElementById("app");

  function markGlyph(st) {

  // Renders the exercise list for one date: an interactive checklist when a
  // workout is assigned (or logged, for old dates), a workout picker when
  // nothing is assigned yet (any date up to today), or a plain message for
  // future dates. Used both inline for Today and inside the day-detail popup.
  function renderSessionEditor(dateStr) {
    var todayD = todayStr();
    var isFuture = dateStr > todayD;
    var exs = exercisesForDate(dateStr);
    var html = "";

    if (isFuture) {
      return exs.length ? "" : '<div class="empty">' + t("nothingScheduled") + "</div>";
    }

    // Always-visible workout picker: switching it any time replaces today's
    // (or that day's) exercises with a fresh copy of the chosen workout. If
    // every saved workout has since been deleted, skip the picker but still
    // show whatever was already logged/assigned for this date.
    if (state.templates.length) {
      var curTplId = state.assignments[dateStr] ? state.assignments[dateStr].templateId : "";
      html += '<div class="section-label" style="margin-top:0">' + t("workoutForDayLabel") + "</div>";
      html += '<select class="ex-picker" data-workout-select="' + dateStr + '">' +
        '<option value="">' + t("restOrChoose") + "</option>";
      state.templates.forEach(function (tp) {
        html += '<option value="' + tp.id + '"' + (tp.id === curTplId ? " selected" : "") + ">" +
          esc(tp.name) + " (" + tp.exercises.length + ")</option>";
      });
      html += "</select>";
    } else if (exs.length === 0) {
      return '<div class="empty">' + t("noTemplatesYet") + "</div>";
    }

    if (exs.length === 0) return html;

    var di = getDateInputs(dateStr);
    exs.forEach(function (ex) {
      if (isSwapTarget("date", dateStr, ex.id)) {
        html += '<div class="card">' + renderSwapPicker("date", dateStr, ex.id) + "</div>";
        return;
      }
      var s = di[ex.id] || { weight: ex.weight, sets: ex.sets, reps: ex.reps, completed: false };
      html += '<div class="card"><div class="ex-row">' +
        '<div class="checkbox' + (s.completed ? " checked" : "") + '" data-action="toggleDate" data-sdate="' + dateStr + '" data-id="' + ex.id + '">' +
        (s.completed ? "&#10003;" : "") + "</div>" +
        '<div class="ex-name">' + esc(ex.name) + '<span class="ex-target">' + t("target") + ex.sets + "x" + ex.reps + " @ " + ex.weight + ex.unit + "</span></div>" +
        '<button class="swap-btn" data-swap-open="1" data-swap-scope="date" data-swap-key="' + dateStr + '" data-swap-ex="' + ex.id + '" title="' + t("swapExerciseBtn") + '">&#8646;</button>' +
        '<div class="inputs">' +
        '<div><label>' + t("wt") + '</label><input type="text" inputmode="decimal" class="dec-input" pattern="[0-9]*[.,]?[0-9]*" data-field="weight" data-sdate="' + dateStr + '" data-id="' + ex.id + '" value="' + s.weight + '" /></div>' +
        '<div><label>' + t("sets") + '</label><input type="number" step="1" min="0" inputmode="numeric" data-field="sets" data-sdate="' + dateStr + '" data-id="' + ex.id + '" value="' + s.sets + '" /></div>' +
        '<div><label>' + t("reps") + '</label><input type="number" step="1" min="0" inputmode="numeric" data-field="reps" data-sdate="' + dateStr + '" data-id="' + ex.id + '" value="' + s.reps + '" /></div>' +
        "</div></div></div>";
    });
    return html;
  }

  function dayDetailHTML(ds) {

  function renderFriends() {
    if (!cloudConfigured()) {
      return '<div class="empty">' + t("friendsNotConfigured") + "</div>";
    }
    if (!cloudReady()) {
      return '<div class="empty">' + t("loadingText") + "</div>";
    }

    var html = "";
    if (!state.cloud.name || state.cloud.editingName) {
      html += '<div class="card"><div class="add-form">' +
        '<div class="field name"><label>' + t("yourFriendNameLabel") + '</label>' +
        '<input id="friendNameInput" placeholder="' + t("yourName") + '" value="' + esc(state.cloud.name) + '" /></div>' +
        '<button class="add-btn" id="saveFriendNameBtn">' + t("save") + "</button>" +
        "</div><div class=\"hint\">" + t("friendsNameHint") + "</div></div>";
      return html;
    }

    html += '<div class="card"><div class="backup-row">' +
      '<div class="detail-sub" style="flex:1">' + esc(state.cloud.name) + "</div>" +
      '<button class="ghost-btn" id="editFriendNameBtn">' + t("editNameBtn") + "</button>" +
      '<button class="ghost-btn" id="refreshFriendsBtn">' + t("refreshBtn") + "</button>" +
      "</div></div>";

    if (state.cloud.loading && !state.cloud.board) {
      html += '<div class="empty">' + t("loadingText") + "</div>";
      return html;
    }
    if (state.cloud.error && !state.cloud.board) {
      html += '<div class="empty">' + t("friendsOfflineNote") + "</div>";
      return html;
    }

    var board = state.cloud.board || { people: {}, recordsByUser: {}, weeksByUser: {} };
    var myUid = window.IronLogCloud.uid;

    // ---- consistency leaderboard: share of the last (up to) 8 logged weeks each person hit their goal ----
    html += '<div class="section-label">' + t("consistencyBoardLabel") + "</div>";
    var consistency = [];
    Object.keys(board.people).forEach(function (uid) {
      var weeks = board.weeksByUser[uid] || {};
      var weekKeys = Object.keys(weeks).sort().slice(-8);
      if (!weekKeys.length) return;
      var hit = 0;
      weekKeys.forEach(function (wk) { var w = weeks[wk]; if (w.goal && w.count >= w.goal) hit++; });
      consistency.push({ uid: uid, name: (board.people[uid] && board.people[uid].name) || "?", hit: hit, total: weekKeys.length });
    });
    consistency.sort(function (a, b) { return (b.hit / b.total) - (a.hit / a.total); });
    if (!consistency.length) {
      html += '<div class="empty">' + t("noFriendsYet") + "</div>";
    } else {
      html += '<div class="card">';
      consistency.forEach(function (p, i) {
        var isMe = p.uid === myUid;
        html += '<div class="lb-row' + (isMe ? " me" : "") + '">' +
          '<div class="lb-name">' + (i === 0 ? "🏆 " : "") + esc(p.name) + (isMe ? '<span class="lb-you">(' + t("youTag") + ")</span>" : "") + "</div>" +
          '<div class="lb-value">' + p.hit + "/" + p.total + "</div></div>";
      });
      html += "</div>";
    }

    // ---- per-exercise records leaderboard ----
    html += '<div class="section-label">' + t("recordsBoardLabel") + "</div>";
    var exerciseMap = {};
    Object.keys(board.recordsByUser).forEach(function (uid) {
      board.recordsByUser[uid].forEach(function (r) {
        if (!exerciseMap[r.key]) exerciseMap[r.key] = { name: r.exerciseName, unit: r.unit };
      });
    });
    var exKeysList = Object.keys(exerciseMap).sort(function (a, b) { return exerciseMap[a].name.localeCompare(exerciseMap[b].name); });
    if (!exKeysList.length) {
      html += '<div class="empty">' + t("noRecordsYet") + "</div>";
      return html;
    }
    var curKey = (state.friendExKey && exerciseMap[state.friendExKey]) ? state.friendExKey : exKeysList[0];
    html += '<select class="ex-picker" id="friendExPicker">';
    exKeysList.forEach(function (k) {
      html += '<option value="' + esc(k) + '"' + (k === curKey ? " selected" : "") + ">" + esc(exerciseMap[k].name) + "</option>";
    });
    html += "</select>";

    var rows = [];
    Object.keys(board.recordsByUser).forEach(function (uid) {
      var rec = board.recordsByUser[uid].find(function (r) { return r.key === curKey; });
      if (rec) rows.push({ uid: uid, name: (board.people[uid] && board.people[uid].name) || "?", best: rec.best, unit: rec.unit });
    });
    rows.sort(function (a, b) { return b.best - a.best; });
    html += '<div class="card">';
    rows.forEach(function (r, i) {
      var isMe = r.uid === myUid;
      html += '<div class="lb-row' + (isMe ? " me" : "") + '">' +
        '<div class="lb-name">' + (i === 0 ? "🏆 " : "") + esc(r.name) + (isMe ? '<span class="lb-you">(' + t("youTag") + ")</span>" : "") + "</div>" +
        '<div class="lb-value">' + r.best + esc(r.unit) + "</div></div>";
    });
    html += "</div>";
    return html;
  }

  // ---------- listeners ----------
  function attachListeners() {
    // Any field meant for a decimal number: convert a typed comma to a period
    // as they type, so a keyboard that only has "," still produces a valid number.
    app.querySelectorAll(".dec-input").forEach(function (el) {
      el.addEventListener("input", function () {
        if (el.value.indexOf(",") === -1) return;
        var pos = el.selectionStart;
        el.value = el.value.replace(/,/g, ".");
        try { el.setSelectionRange(pos, pos); } catch (e) {}
      });
    });

    app.querySelectorAll("[data-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.tab = btn.getAttribute("data-tab");
        state.selectedDate = null;
        if (state.tab === "friends" && cloudReady() && state.cloud.name && !state.cloud.board && !state.cloud.loading) {
          loadFriendsBoard();
        }
        render();
      });
    });
    app.querySelectorAll("[data-date]").forEach(function (el) {
      el.addEventListener("click", function () {
        var ds = el.getAttribute("data-date");
        state.selectedDate = (state.selectedDate === ds) ? null : ds;
        render();
      });
    });
    var closeDetail = document.getElementById("closeDetail");
    if (closeDetail) {
      closeDetail.addEventListener("click", function () { state.selectedDate = null; render(); });

        ev.preventDefault();
        clearWeightForDate(el.getAttribute("data-wdate"));

      btn.addEventListener("click", function () {
        state.selectedTemplateId = btn.getAttribute("data-select-tpl");
        state.newExLibId = "";

        render();
      });

    var newTplNameEl = document.getElementById("newTplName");
    if (newTplNameEl) newTplNameEl.addEventListener("input", function () { state.newTplName = newTplNameEl.value; });
    var addTplBtn = document.getElementById("addTplBtn");
    if (addTplBtn) addTplBtn.addEventListener("click", addTemplate);

    var tplNameInput = document.getElementById("tplNameInput");
    if (tplNameInput) {
      var rn = function () { renameTemplate(state.selectedTemplateId, tplNameInput.value); };
      tplNameInput.addEventListener("change", rn);
      tplNameInput.addEventListener("blur", rn);
    }
    var delTplBtn = document.getElementById("delTplBtn");
    if (delTplBtn) delTplBtn.addEventListener("click", function () { deleteTemplate(state.selectedTemplateId); });

    var exLibraryPicker = document.getElementById("exLibraryPicker");
    if (exLibraryPicker) {
      exLibraryPicker.addEventListener("change", function () {
        state.newExLibId = exLibraryPicker.value;
        if (exLibraryPicker.value) {
          var le = libraryEntry(exLibraryPicker.value);
          if (le) state.newEx = { name: le.name, sets: le.sets, reps: le.reps, weight: le.weight, unit: le.unit };
        } else {
          state.newEx = { name: "", sets: 3, reps: 10, weight: 20, unit: state.newEx.unit };
        }
        render();
      });
    }
    var addBtn = document.getElementById("addExBtn");
    if (addBtn) {
      [["newExName", "name"], ["newExSets", "sets"], ["newExReps", "reps"], ["newExWeight", "weight"], ["newExUnit", "unit"]]
        .forEach(function (pair) {
          var el = document.getElementById(pair[0]);
          if (!el) return;
          var h = function () { state.newEx[pair[1]] = el.value; };
          el.addEventListener("input", h);
          el.addEventListener("change", h);
        });
      addBtn.addEventListener("click", addExerciseToTemplate);
    }
    app.querySelectorAll('[data-action="removeTplEx"]').forEach(function (el) {
      el.addEventListener("click", function () {
        removeTemplateExercise(el.getAttribute("data-tpl-id"), el.getAttribute("data-ex-id"));
      });
    });
    app.querySelectorAll("[data-tpl-id][data-ex-id]").forEach(function (el) {
      var h = function () {
        updateTemplateExField(el.getAttribute("data-tpl-id"), el.getAttribute("data-ex-id"),
          el.getAttribute("data-plan-field"), el.value);
      };
      el.addEventListener("change", h);
      el.addEventListener("blur", h);
    });

    // ---- swap exercise (Today session editor + Workouts tab) ----
    app.querySelectorAll("[data-swap-open]").forEach(function (el) {
      el.addEventListener("click", function () {
        openSwap(el.getAttribute("data-swap-scope"), el.getAttribute("data-swap-key"), el.getAttribute("data-swap-ex"));
      });
    });
    app.querySelectorAll("[data-swap-cancel]").forEach(function (el) {
      el.addEventListener("click", cancelSwap);
    });
    app.querySelectorAll("[data-swap-back]").forEach(function (el) {
      el.addEventListener("click", function () { if (state.swap) { state.swap.mode = "quick"; render(); } });
    });
    app.querySelectorAll("[data-swap-quick]").forEach(function (el) {
      el.addEventListener("change", function () {
        var scope = el.getAttribute("data-swap-scope"), key = el.getAttribute("data-swap-key"), exId = el.getAttribute("data-swap-ex");
        if (el.value === "__add__") { if (state.swap) { state.swap.mode = "add"; render(); } return; }
        if (el.value === "cur") return;
        quickSwapToAlt(scope, key, exId, el.value);
      });
    });
    app.querySelectorAll("[data-swap-lib]").forEach(function (el) {
      el.addEventListener("change", function () {
        if (!el.value) return; // still on "+ New exercise" -- wait for the name field instead
        swapToLibraryEntry(el.getAttribute("data-swap-scope"), el.getAttribute("data-swap-key"), el.getAttribute("data-swap-ex"), el.value);
      });
    });
    app.querySelectorAll("[data-swap-name]").forEach(function (el) {
      el.addEventListener("input", function () {
        if (state.swap) state.swap.newName = el.value;
      });
      el.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") {
          swapToNewName(el.getAttribute("data-swap-scope"), el.getAttribute("data-swap-key"), el.getAttribute("data-swap-ex"), el.value);
        }
      });
    });
    app.querySelectorAll("[data-swap-confirm]").forEach(function (el) {
      el.addEventListener("click", function () {
        var row = el.closest(".swap-row");
        var nameInput = row ? row.querySelector("[data-swap-name]") : null;
        swapToNewName(el.getAttribute("data-swap-scope"), el.getAttribute("data-swap-key"), el.getAttribute("data-swap-ex"), nameInput ? nameInput.value : "");
      });
    });

    var picker = document.getElementById("progressPicker");
    if (picker) picker.addEventListener("change", function () { state.progressExKey = picker.value; render(); });

    function bind(id, key, rerender) {
      var el = document.getElementById(id);
      if (!el) return;
      var h = function () { state.profile[key] = el.value; persistProfile(); if (rerender) render(); };
      el.addEventListener("change", h);
      if (!rerender) el.addEventListener("blur", h);
    }
    bind("profName", "name", false);
    bind("profHeight", "height", false);
    bind("profHeightUnit", "heightUnit", true);
    bind("profWeightUnit", "weightUnit", true);

    var profGoal = document.getElementById("profWeeklyGoal");
    if (profGoal) {
      var gh = function () { state.profile.weeklyGoal = parseInt2(profGoal.value) || 0; persistProfile(); render(); };
      profGoal.addEventListener("change", gh);
      profGoal.addEventListener("blur", gh);
    }

    var profGender = document.getElementById("profGender");
    if (profGender) {
      profGender.addEventListener("change", function () {
        state.profile.gender = profGender.value;
        persistProfile();
        sessionMessage = null; // pick a fresh message that matches the new gender
        pushConfigToSW();
        render();
      });
    }

    var profLang = document.getElementById("profLang");
    if (profLang) {
      profLang.addEventListener("change", function () {
        state.lang = profLang.value;
        persistLang();
        render();
      });
    }

    var twi = document.getElementById("todayWeightInput");
    if (twi) {
      twi.addEventListener("input", function () { state.todayWeightInput = twi.value; });
      twi.addEventListener("blur", saveTodayWeight);
    }
    var swb = document.getElementById("saveWeightBtn");
    if (swb) swb.addEventListener("click", saveTodayWeight);

    app.querySelectorAll(".wlog-input").forEach(function (el) {
      var commit = function () { editWeightForDate(el.getAttribute("data-wdate"), el.value); };
      el.addEventListener("change", commit);
      el.addEventListener("blur", commit);
    });
    app.querySelectorAll(".wlog-del").forEach(function (el) {
      el.addEventListener("click", function () { clearWeightForDate(el.getAttribute("data-wdate")); });
    });

    var installBtn = document.getElementById("installBtn");
    if (installBtn) {
      installBtn.addEventListener("click", function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () {
          deferredPrompt = null;
          render();
        });
      });
    }
    var dismissBtn = document.getElementById("dismissInstall");
    if (dismissBtn) {
      dismissBtn.addEventListener("click", function () { installDismissed = true; render(); });
    }

    var remOn = document.getElementById("remOn");
    if (remOn) remOn.addEventListener("click", enableReminders);
    var remOff = document.getElementById("remOff");
    if (remOff) remOff.addEventListener("click", disableReminders);

    var remTime = document.getElementById("remTime");
    if (remTime) {
      remTime.addEventListener("change", function () {
        var parts = String(remTime.value || "").split(":");
        if (parts.length !== 2) return;
        var h = parseInt2(parts[0]), m = parseInt2(parts[1]);
        if (h < 0 || h > 23 || m < 0 || m > 59) return;
        state.reminders.hour = h;
        state.reminders.minute = m;
        state.reminders.lastNotified = "";
        persistReminders();
        scheduleReminder();
        render();
      });
    }

    var remTest = document.getElementById("remTest");
    if (remTest) {
      remTest.addEventListener("click", function () {
        if (notifPermission() === "granted") {
          showNotification(pickMessage());
          flash("Sent. If nothing appeared, notifications are blocked in your phone settings.");
        } else {
          flash(pickMessage());
        }
      });
    }

    var exportBtn = document.getElementById("exportBtn");
    if (exportBtn) exportBtn.addEventListener("click", exportData);

    var copyBtn = document.getElementById("copyBtn");
    if (copyBtn) {
      copyBtn.addEventListener("click", function () {
        copyText(JSON.stringify({
          app: "IronLog", version: 1, exportedAt: new Date().toISOString(),
          data: {
            ironlog_week: state.week,
            ironlog_day_labels: state.dayLabels,
            ironlog_logs: state.logs,
            ironlog_profile: state.profile,
            ironlog_weight_logs: state.weightLogs,
            ironlog_templates: state.templates,
            ironlog_assignments: state.assignments,
            ironlog_exercises: state.library,
            ironlog_reminders: state.reminders,
            ironlog_friend_name: state.cloud.name
          }
        }, null, 2));
      });
    }

    var friendNameInput = document.getElementById("friendNameInput");
    var saveFriendNameBtn = document.getElementById("saveFriendNameBtn");
    if (friendNameInput && saveFriendNameBtn) {
      var doSaveFriendName = function () {
        var v = friendNameInput.value.trim();
        if (!v) return;
        saveFriendName(v);
        render();
      };
      saveFriendNameBtn.addEventListener("click", doSaveFriendName);
      friendNameInput.addEventListener("keydown", function (ev) { if (ev.key === "Enter") doSaveFriendName(); });
    }
    var editFriendNameBtn = document.getElementById("editFriendNameBtn");
    if (editFriendNameBtn) {
      editFriendNameBtn.addEventListener("click", function () { state.cloud.editingName = true; render(); });
    }
    var refreshFriendsBtn = document.getElementById("refreshFriendsBtn");
    if (refreshFriendsBtn) refreshFriendsBtn.addEventListener("click", loadFriendsBoard);
    var friendExPicker = document.getElementById("friendExPicker");
    if (friendExPicker) friendExPicker.addEventListener("change", function () { state.friendExKey = friendExPicker.value; render(); });

    var importBtn = document.getElementById("importBtn");
    var importFile = document.getElementById("importFile");
    if (importBtn && importFile) {
      importBtn.addEventListener("click", function () { importFile.click(); });
      importFile.addEventListener("change", function () {
        var f = importFile.files && importFile.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () { importData(String(reader.result)); };
        reader.onerror = function () { flash("Could not read that file."); };
        reader.readAsText(f);
      });
    }
  }

  render();
  initCloud();

  scheduleReminder();
  maybeNotifyNow();
  try {
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) {
        refreshDateInputs(todayStr());
        maybeNotifyNow();
        scheduleReminder();
        render();
        if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistration) {
          navigator.serviceWorker.getRegistration().then(function (reg) {
            if (reg) reg.update().catch(function () {});
          }).catch(function () {});
        }
      }
    });
  } catch (e) {}

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" })
        .then(function (reg) {
          pushConfigToSW();
          if (state.reminders.enabled) registerPeriodicSync();
          reg.update().catch(function () {});
        }).catch(function () {});
    });
  }
})();
</script>
</body>
</html>
